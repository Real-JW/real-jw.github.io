name: Check generated website

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated HTML, metadata, and crawler files
        run: python3 scripts/build_site.py --check
      - name: Check crawler-readable page content and links
        run: python3 scripts/check_site.py
      - name: Validate the JavaScript
        run: |
          node --check assets/js/script.js
          node --check assets/js/logo.js
